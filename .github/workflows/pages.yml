name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the version includes the commit count

      - name: Stamp version
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          DATE=$(git show -s --format=%cd --date=format:'%Y.%m.%d' HEAD)
          ISO=$(git show -s --format=%cI HEAD)
          cat > assets/version.js <<VEOF
          /* Stamped by the deploy workflow. The checked-in copy says "dev". */
          var GUIDE_VERSION = { v: 'v${DATE}.${COUNT}', sha: '${SHA}', date: '${ISO}' };
          VEOF
          cat assets/version.js

      - name: Validate topic data
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('data/topics.json'))
          ids = [t['id'] for t in d]
          assert len(ids) == len(set(ids)), 'duplicate topic ids'
          allowed = {'Low', 'Medium', 'High', 'Complex'}
          bad = [t['id'] for t in d if t.get('difficulty') not in allowed]
          assert not bad, f'invalid difficulty on: {bad[:5]}'
          print(f'{len(d)} topics OK')
          "

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
